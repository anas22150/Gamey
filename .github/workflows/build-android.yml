
name: Build Party Legends APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build APK with Godot
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Android
          export_debug: true
          verbose: true

      - name: Check export output
        if: always()
        shell: bash
        run: |
          echo "========== CURRENT DIRECTORY =========="
          pwd

          echo "========== APK FILES =========="
          find . -type f -iname "*.apk" -print

          echo "========== PROJECT FILES =========="
          find . -maxdepth 4 -type f | sort | head -200

          echo "========== EXPORT DIRECTORIES =========="
          ls -lah
          ls -lah build 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Party-Legends-APK
          path: |
            **/*.apk
          if-no-files-found: error
          
