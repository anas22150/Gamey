
name: Build Party Legends APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build APK with Godot
        id: godot_export
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: Android
          export_debug: true
          verbose: true

      - name: Copy APK to project directory
        shell: bash
        run: |
          APK=$(find "$HOME/.local/share/godot/builds" -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK file was not generated!"
            find "$HOME/.local/share/godot/builds" -type f
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/PartyLegends.apk"
          echo "APK copied successfully!"
          ls -lh "$GITHUB_WORKSPACE/PartyLegends.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Party-Legends-APK
          path: PartyLegends.apk
          if-no-files-found: error
          
